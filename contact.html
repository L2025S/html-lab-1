<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style-contact.css" />
    <title>Contact Us</title>
  </head>
  <body>
    <header>
      <h1>L.W. Website</h1>
      <nav>
        <ul>
          <li><a href="index.html">Start</a></li>
          <li><a href="products.html">Products</a></li>
          <li><a href="about.html">About Us</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="privacy.html">Privacy</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h2>Contact Us</h2>
      <section id="contact-section">
        <form action="" method="POST">
          <fieldset>
            <legend>Contact Us</legend>

            <div>
              <label for="name">Name*</label>
              <input type="text" id="name" name="name" autocomplete="name" required />
            </div>

            <div>
              <label for="email">E-mail*</label>
              <input type="email" id="email" name="email" autocomplete="email" required />
            </div>

            <div>
              <label for="subject">Subject*</label>
              <select name="subject" id="subject" required>
                <option value="">Choose a subject</option>
                <option value="technique-problem">Technique problem</option>
                <option value="Order">Order</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div>
              <label for="message">Message</label>
              <textarea
                name="message"
                id="message"
                rows="10"
              
                minlength="10"
                maxlength="2000"
                placeholder="Write your message here...(10 -2000 characters)"
                required
              ></textarea>
            </div>

            <div>
              <button type="submit" class="btn-formula">Send</button>
            </div>

            <div>
              <input
                type="checkbox"
                id="agree-privacy-policy"
                name="agree-privacy-policy"
                value="yes"
                required
              />
              <label for="agree-privacy-policy"
                >Agree to our Personal Data Policy*</label
              >
              <p>
                <em
                  >We only use the personal data to reply to message. <br />
                  <a href="privacy.html" id="contact-section-a"
                    >Read more about our Personal Data Policy</a
                  >
                </em>
              </p>
            </div>
          </fieldset>
        </form>
      </section>
    </main>

    <footer>&copy; 2026 created by L.W.</footer>
  </body>
</html>
