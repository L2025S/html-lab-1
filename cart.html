<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="cart.css" />
    <script src="cart-page.js" defer></script>
    <script src="ShoppingCart.js" defer></script>
    <title>Shopping Cart</title>
  </head>
  <body>
    <header>
      <h1>L.W. Website</h1>
      <nav>
        <ul>
          <li><a href="index.html">Start</a></li>
          <li><a href="products.html">Products</a></li>
          <li><a href="about.html">About Us</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="privacy.html">Privacy</a></li>
          <li><a href="cart.html">Cart</a></li>
          <li>
            <a href="products.html" class="continue-shopping"
              >← Continue Shopping</a
            >
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="cart-container">
        <!-- Cart items: dynamically rendered by JavaScript -->
        <div class="cart-items" id="cartItems">
          <!-- Dynamic content -->
        </div>

        <!-- Cart summary -->
        <div class="cart-summary" id="cartSummary">
          <h2>Order Summary</h2>
          <div class="summary-row">
            <span>Total Items</span>
            <span id="totalItems">0</span>
          </div>
          <div class="summary-row">
            <span>Subtotal</span>
            <span id="subtotal">SEK 0.00</span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span id="shipping">SEK 0.00 </span>
          </div>
          <div class="summary-row total">
            <span>Total</span>
            <span id="total">SEK 0.00 </span>
          </div>
          <button class="checkout-btn" id="checkoutBtn">
            Proceed to Checkout
          </button>
          <button class="clear-cart-btn" id="clearCartBtn">Clear Cart</button>
        </div>
      </div>
    </main>
  </body>
</html>
